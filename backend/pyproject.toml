[project]
name = "awaazify-api"
version = "0.11.0"
description = "Awaazify authenticated studio API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
modal = ["modal>=1,<2"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
[tool.ruff]
line-length=100
